name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.task == 'lint'
        run: pnpm format:check
      - run: pnpm turbo run ${{ matrix.task }}

  react18:
    name: react 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @cauce/react and @cauce/ui support React 18 and 19; the workspace develops against 19.
      - name: Install React 18
        run: pnpm --filter @cauce/react --filter @cauce/ui add -D react@^18.3.1 react-dom@^18.3.1 @types/react@^18.3.0 @types/react-dom@^18.3.0
      - run: pnpm turbo run build --filter=@cauce/react
      - run: pnpm --filter @cauce/react --filter @cauce/ui typecheck
      - run: pnpm --filter @cauce/react --filter @cauce/ui test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: contracts
      - run: forge build --sizes
        working-directory: contracts
      - run: forge test
        working-directory: contracts
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Relayer end-to-end tests (anvil + compiled contracts)
        run: pnpm turbo run test:e2e
        env:
          CAUCE_E2E: '1'
      - name: Check generated ABIs are up to date
        run: |
          pnpm --filter @cauce/core generate:abis
          git diff --exit-code -- packages/core/src/abis/generated.ts
